services:
  - type: web
    name: name-tesis-lstm-gru-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CORS_ALLOWED_ORIGINS
        value: https://tesis-lstm-gru.anthonyjanampacalderon10.workers.dev
      - key: API_WRITE_TOKEN
        generateValue: true
